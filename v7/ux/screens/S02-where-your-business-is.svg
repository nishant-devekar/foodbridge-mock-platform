<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 844" width="1210" height="844" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- S02 — Where your business is · THREE STATES. LOW FIDELITY.
       Flow node: F02. Redrawn against D-018.

       MUST-HAVE ONLY. Removed: the instruction line "Pick one and we'll bring
       across what we can" — the rows are the decision.

       NOTHING READS ON A TAP (D-018 rule 2). A source opens CONSENT; the user
       connects. Sample is a first-class answer to the same question, not a URL
       flag, and it has its own confirmation. -->
  <rect x="0" y="0" width="1210" height="844" fill="#ffffff"/>

  <!-- ============================ sources ============================ -->
  <rect x="0" y="0" width="390" height="844" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="24" y="44" font-size="13" font-weight="600" fill="#111111">FoodBridge</text>
  <text x="120" y="44" font-size="11" fill="#999999">Step 2 of 3</text>
  <rect x="24" y="58" width="80" height="3" rx="2" fill="#111111"/>
  <rect x="110" y="58" width="80" height="3" rx="2" fill="#111111"/>
  <rect x="196" y="58" width="80" height="3" rx="2" fill="#e5e7eb"/>
  <text x="24" y="92" font-size="16" fill="#999999">&#8249;</text>

  <text x="24" y="132" font-size="23" font-weight="600" fill="#111111">Where is your</text>
  <text x="24" y="160" font-size="23" font-weight="600" fill="#111111">business data today?</text>

  <rect x="20" y="196" width="350" height="62" rx="12" fill="none" stroke="#111111" stroke-width="1.5"/>
  <rect x="36" y="210" width="34" height="34" rx="9" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="86" y="233" font-size="16" fill="#111111">Tally</text>
  <text x="352" y="233" font-size="15" fill="#cccccc" text-anchor="end">&#8250;</text>

  <rect x="20" y="268" width="350" height="62" rx="12" fill="none" stroke="#111111" stroke-width="1.5"/>
  <rect x="36" y="282" width="34" height="34" rx="9" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="86" y="305" font-size="16" fill="#111111">Zoho</text>
  <text x="352" y="305" font-size="15" fill="#cccccc" text-anchor="end">&#8250;</text>

  <rect x="20" y="340" width="350" height="62" rx="12" fill="none" stroke="#111111" stroke-width="1.5"/>
  <rect x="36" y="354" width="34" height="34" rx="9" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="86" y="377" font-size="16" fill="#111111">Vyapar</text>
  <text x="352" y="377" font-size="15" fill="#cccccc" text-anchor="end">&#8250;</text>

  <rect x="20" y="412" width="350" height="62" rx="12" fill="none" stroke="#111111" stroke-width="1.5"/>
  <rect x="36" y="426" width="34" height="34" rx="9" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="86" y="449" font-size="16" fill="#111111">Files or documents</text>
  <text x="352" y="449" font-size="15" fill="#cccccc" text-anchor="end">&#8250;</text>

  <!-- quieter: a real answer, never competing with the four sources -->
  <line x1="20" y1="508" x2="370" y2="508" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="540" font-size="14" fill="#666666">Show me with a sample business</text>
  <text x="352" y="540" font-size="15" fill="#cccccc" text-anchor="end">&#8250;</text>

  <!-- ======================= consent · connect ======================= -->
  <rect x="410" y="0" width="390" height="844" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="410" y="0" width="390" height="844" fill="#f6f8f7" opacity="0.6"/>
  <rect x="410" y="300" width="390" height="544" rx="18" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="580" y="318" width="50" height="4" rx="2" fill="#e5e7eb"/>

  <text x="434" y="374" font-size="21" font-weight="600" fill="#111111">Connect Tally</text>

  <text x="434" y="414" font-size="10" font-weight="700" fill="#999999">WHAT WE'LL READ</text>
  <text x="434" y="442" font-size="14" fill="#111111">&#183;  Your customers</text>
  <text x="434" y="468" font-size="14" fill="#111111">&#183;  Your products</text>
  <text x="434" y="494" font-size="14" fill="#111111">&#183;  Your order history</text>

  <text x="434" y="538" font-size="10" font-weight="700" fill="#999999">WHAT WON'T CHANGE</text>
  <text x="434" y="566" font-size="14" fill="#111111">&#183;  Nothing is written back to Tally</text>

  <rect x="430" y="676" width="350" height="54" rx="10" fill="#111111"/>
  <text x="605" y="710" font-size="16" fill="#ffffff" text-anchor="middle">Connect</text>
  <text x="605" y="764" font-size="14" fill="#666666" text-anchor="middle">Cancel</text>

  <!-- ======================= consent · sample ======================== -->
  <rect x="820" y="0" width="390" height="844" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="820" y="0" width="390" height="844" fill="#f6f8f7" opacity="0.6"/>
  <rect x="820" y="380" width="390" height="464" rx="18" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <rect x="990" y="398" width="50" height="4" rx="2" fill="#e5e7eb"/>

  <text x="844" y="454" font-size="21" font-weight="600" fill="#111111">Use a sample business</text>

  <text x="844" y="496" font-size="14" fill="#111111">You'll see a demonstration business,</text>
  <text x="844" y="518" font-size="14" fill="#111111">not your own.</text>

  <!-- the provenance strip, drawn so its persistence is unmistakable -->
  <rect x="840" y="548" width="350" height="44" rx="8" fill="none" stroke="#111111" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="858" y="576" font-size="12" font-weight="700" fill="#111111">SAMPLE BUSINESS</text>
  <text x="844" y="614" font-size="12" fill="#666666">This marker stays on every screen.</text>
  <text x="844" y="634" font-size="12" fill="#666666">Nothing connects to your account.</text>

  <rect x="840" y="700" width="350" height="54" rx="10" fill="#111111"/>
  <text x="1015" y="734" font-size="16" fill="#ffffff" text-anchor="middle">Use the sample</text>
  <text x="1015" y="788" font-size="14" fill="#666666" text-anchor="middle">Cancel</text>
</svg>
