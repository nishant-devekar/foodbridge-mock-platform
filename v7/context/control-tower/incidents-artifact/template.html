<meta charset="utf-8">
<title>Deliveries Incident Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root {
  --ground: #F3F5F2; --surface: #FFFFFF; --sunk: #E9EDE8; --ink: #131916; --ink-2: #545E58; --ink-3: #85908A;
  --line: #DAE0DA; --accent: #1E7A46; --accent-t: #E2F0E7;
  --ugly: #C0362C; --ugly-t: #FBEAE8; --bad: #A86E12; --bad-t: #FBF1E0; --good: #1E7A46; --good-t: #E6F2EA;
  --cov1: #131916; --cov2: #8E9B93; --bezel: #111416; --shadow: 0 1px 2px rgba(19,25,22,.06), 0 8px 28px rgba(19,25,22,.08);
  --f-display: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Instrument Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0E1210; --surface: #161B18; --sunk: #1C231F; --ink: #E5ECE7; --ink-2: #A3AEA7; --ink-3: #737E78;
    --line: #29312C; --accent: #5CCB8A; --accent-t: #16301F;
    --ugly: #F07A6E; --ugly-t: #3A1C19; --bad: #E2AE55; --bad-t: #362A14; --good: #5CCB8A; --good-t: #16301F;
    --cov1: #E5ECE7; --cov2: #6C7972; --bezel: #000; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0E1210; --surface: #161B18; --sunk: #1C231F; --ink: #E5ECE7; --ink-2: #A3AEA7; --ink-3: #737E78;
  --line: #29312C; --accent: #5CCB8A; --accent-t: #16301F;
  --ugly: #F07A6E; --ugly-t: #3A1C19; --bad: #E2AE55; --bad-t: #362A14; --good: #5CCB8A; --good-t: #16301F;
  --cov1: #E5ECE7; --cov2: #6C7972; --bezel: #000; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font: 400 16px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
.page { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 80px; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

/* ── masthead ─────────────────────────────────────────── */
.mast { display: grid; gap: 14px; padding-bottom: 28px; border-bottom: 1px solid var(--line); margin-bottom: 28px; }
.eyebrow { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); display: flex; gap: 10px; flex-wrap: wrap; }
.eyebrow b { color: var(--accent); font-weight: 500; }
h1 { font: 800 clamp(34px, 6vw, 58px)/1.02 var(--f-display); letter-spacing: -.035em; margin: 0; text-wrap: balance; max-width: 16ch; }
.lead { max-width: 68ch; color: var(--ink-2); display: grid; gap: 8px; }
.lead p { margin: 0; }
.lead strong { color: var(--ink); }

/* ── layout ───────────────────────────────────────────── */
.grid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 48px; align-items: start; }
.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 20px); display: grid; gap: 2px; font-size: 14px; }
.toc a { display: flex; gap: 10px; padding: 6px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; line-height: 1.3; }
.toc a:hover { background: var(--sunk); color: var(--ink); }
.toc a.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.toc .n, h2 .n { font: 500 12px/1.6 var(--f-mono); color: var(--ink-3); min-width: 16px; }
main { min-width: 0; }
section { padding-block: 8px 36px; scroll-margin-top: 16px; }
section + section { border-top: 1px solid var(--line); padding-top: 36px; }
h2 { font: 700 clamp(24px, 3.4vw, 32px)/1.15 var(--f-display); letter-spacing: -.02em; margin: 0 0 16px; text-wrap: balance; display: flex; gap: 12px; align-items: baseline; }
h2 .n { font-size: 14px; }
h3 { font: 700 18px/1.3 var(--f-display); margin: 28px 0 10px; }
main p, main ul, main ol { max-width: 70ch; }
main p { margin: 0 0 14px; }
main ol, main ul { padding-left: 22px; margin: 0 0 16px; display: grid; gap: 8px; }
main li::marker { color: var(--ink-3); font-family: var(--f-mono); font-size: 13px; }
code { font: 500 .86em var(--f-mono); background: var(--sunk); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
blockquote { margin: 0 0 20px; padding: 18px 22px; background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); font: 700 clamp(18px, 2.4vw, 22px)/1.35 var(--f-display); letter-spacing: -.01em; max-width: none; }
blockquote strong { font-weight: 800; }
.tbl { overflow-x: auto; margin: 0 0 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.tbl table { border-collapse: collapse; width: 100%; font-size: 14px; line-height: 1.45; }
.tbl th { text-align: left; font: 500 11px/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 11px 14px; border-bottom: 1px solid var(--line); background: var(--sunk); white-space: nowrap; }
.tbl td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 120px; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td:first-child { font-weight: 600; }
pre.code { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; overflow-x: auto; font: 400 13px/1.6 var(--f-mono); margin: 0 0 20px; }
pre.code code { background: none; padding: 0; font: inherit; }
figure.mm { margin: 0 0 20px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
figure.mm pre { margin: 0; font: 13px/1.5 var(--f-mono); white-space: pre; color: var(--ink-2); }

/* ── standing pills (shared) ──────────────────────────── */
.pill { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 var(--f-body); padding: 5px 9px; border-radius: 999px; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.ugly { color: var(--ugly); background: var(--ugly-t); }
.pill.bad { color: var(--bad); background: var(--bad-t); }
.pill.good { color: var(--good); background: var(--good-t); }

/* ── fig: loop ────────────────────────────────────────── */
.fig-loop { margin: 4px 0 24px; }
.loop { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; max-width: none; }
.loop li { position: relative; background: var(--surface); border-radius: 14px; padding: 14px 14px 16px; box-shadow: var(--shadow); display: grid; gap: 6px; align-content: start; }
.loop li:not(:last-child)::after { content: "→"; position: absolute; right: -10px; top: 18px; transform: translateX(50%); color: var(--ink-3); font: 600 14px/1 var(--f-mono); z-index: 1; }
.loop .k { font: 500 11px/1 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.loop .w { font: 700 16px/1.2 var(--f-display); }
.loop .e { font-size: 13px; color: var(--ink-2); line-height: 1.4; }
.loop .dot { width: 10px; height: 10px; border-radius: 50%; }
.loop .dot.ugly { background: var(--ugly); } .loop .dot.bad { background: var(--bad); } .loop .dot.good { background: var(--good); }
.loop-back { margin-top: 10px; display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--ink-2); padding: 10px 14px; border: 1px dashed var(--line); border-radius: 12px; }
.loop-back b { color: var(--bad); font-weight: 600; }

/* ── fig: catalogue ───────────────────────────────────── */
.fig-catalog { margin: 8px 0 18px; display: grid; gap: 16px; }
.cov { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 24px; background: var(--surface); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
.cov-total { display: grid; gap: 12px; align-content: start; }
.cov-total .big { display: flex; gap: 18px; flex-wrap: wrap; }
.cov-total .big div { display: grid; }
.cov-total .big b { font: 800 34px/1 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.cov-total .big span { font-size: 12px; color: var(--ink-2); margin-top: 4px; }
.cov-key { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); }
.cov-key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.sw1 { background: var(--cov1); } .sw2 { background: var(--cov2); } .sw3 { background: transparent; border: 1.5px dashed var(--cov2); }
.cov-rows { display: grid; gap: 7px; }
.cov-row { display: grid; grid-template-columns: 104px minmax(0, 1fr) 22px; gap: 10px; align-items: center; font-size: 13px; background: none; border: 0; padding: 2px 4px; margin: 0 -4px; border-radius: 6px; color: var(--ink); cursor: pointer; text-align: left; font-family: inherit; }
.cov-row:hover, .cov-row.on { background: var(--sunk); }
.cov-row .bars { display: flex; height: 12px; gap: 2px; }
.cov-row .bars i { border-radius: 3px; height: 100%; }
.cov-row .bars i.s3 { border: 1.5px dashed var(--cov2); }
.cov-row .c { font: 500 12px var(--f-mono); color: var(--ink-3); text-align: right; font-variant-numeric: tabular-nums; }
.cat-ctl { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.cat-ctl input { flex: 1 1 220px; min-width: 0; font: 15px var(--f-body); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font: 500 13px/1 var(--f-body); padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.chip.on { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.cat-count { font: 500 12px var(--f-mono); color: var(--ink-3); }
.cat { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow-x: auto; }
.cat table { border-collapse: collapse; width: 100%; min-width: 1080px; font-size: 13.5px; line-height: 1.45; }
.cat th { text-align: left; font: 500 11px/1.3 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding: 11px 12px; background: var(--sunk); border-bottom: 1px solid var(--line); position: sticky; top: 0; }
.cat td { padding: 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.cat tr:last-child td { border-bottom: 0; }
.cat .inc b { display: block; font-weight: 600; }
.cat .inc small, .cat .who { font: 500 11px/1.4 var(--f-mono); color: var(--ink-3); letter-spacing: .02em; }
.cat .who { display: block; margin-top: 3px; }
.today { font: 500 11px/1 var(--f-mono); padding: 5px 8px; border-radius: 6px; white-space: nowrap; display: inline-block; }
.today.t1 { background: var(--cov1); color: var(--surface); }
.today.t2 { background: var(--sunk); color: var(--ink); }
.today.t3 { border: 1.5px dashed var(--cov2); color: var(--ink-2); }
.done-in { display: inline-block; margin-top: 5px; font: 500 11px/1.35 var(--f-mono); color: var(--accent); }
.att { font-size: 12.5px; color: var(--ink-2); }
.att.urgent { color: var(--ugly); font-weight: 600; }
.cat-empty { padding: 28px; text-align: center; color: var(--ink-2); }

/* ── fig: sketches (player) ───────────────────────────── */
.fig-sketches { margin: 8px 0 12px; }
.player { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; background: var(--surface); border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
.sc-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
.sc-arc { font-size: 13px; color: var(--ink-2); margin: 0 0 14px; }
.stages { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 16px; }
.stages span { font: 500 11px/1 var(--f-mono); padding: 6px 8px; border-radius: 6px; background: var(--sunk); color: var(--ink-3); letter-spacing: .02em; }
.stages span.on { background: var(--accent); color: var(--surface); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-width: none; }
.steps button { width: 100%; text-align: left; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid transparent; background: none; color: var(--ink-2); font: 14px/1.5 var(--f-body); cursor: pointer; }
.steps button:hover { background: var(--sunk); }
.steps button.on { background: var(--ground); border-color: var(--line); color: var(--ink); }
.steps .sn { font: 500 12px/26px var(--f-mono); width: 26px; height: 26px; text-align: center; border-radius: 50%; background: var(--sunk); color: var(--ink-3); }
.steps button.on .sn { background: var(--ink); color: var(--surface); }
.steps strong { color: var(--ink); }
.stage-col { display: grid; gap: 12px; justify-items: center; align-content: start; }
.area { width: 100%; max-width: 320px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; }
.area .nm { font: 700 14px var(--f-display); }
.chase { width: 100%; max-width: 320px; font: 500 11px/1.4 var(--f-mono); color: var(--ink-3); display: flex; justify-content: space-between; gap: 8px; }
.nav { display: flex; gap: 8px; }
.nav button { font: 600 13px var(--f-body); padding: 9px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.nav button.pri { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.nav button:disabled { opacity: .4; cursor: default; }

/* The phone is the Control Tower's own look, light only, as the product is. */
.ph { --c-ink: #111418; --c-ink2: #5B616B; --c-ink3: #8A9099; --c-line: #E5E7E9; --c-fill: #F6F7F8; --c-brand: #1E7A46;
      --c-good: #1E7A46; --c-good-t: #E8F3EC; --c-bad: #B7791F; --c-bad-t: #FBF1E0; --c-ugly: #C0362C; --c-ugly-t: #FBEAE8; --rd: #1B6272;
  width: 320px; max-width: 100%; height: 640px; border: 10px solid var(--bezel); border-radius: 40px; background: #fff; color: var(--c-ink);
  position: relative; overflow: hidden; font: 400 13px/1.35 Inter, -apple-system, "Segoe UI", sans-serif; box-shadow: var(--shadow); isolation: isolate; }
.ph * { letter-spacing: -.005em; }
.ph-sb { height: 30px; display: flex; justify-content: space-between; align-items: center; padding: 0 22px; font: 600 12px Inter, sans-serif; }
.ph-sb i { width: 60px; height: 16px; background: var(--bezel); border-radius: 10px; }
.ph-app { font: 500 10px/1 var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--c-ink3); text-align: center; padding: 2px 0 6px; }
.ph-scr { position: absolute; inset: 48px 0 0 0; display: flex; flex-direction: column; }
.ph-scr > .bd { flex: 1; overflow: hidden; padding: 0 14px; }
.ph-tb { display: flex; align-items: center; gap: 8px; padding: 8px 14px 10px; border-bottom: 1px solid var(--c-line); font-weight: 700; font-size: 15px; }
.ph-tb .bk { color: var(--c-ink2); font-weight: 500; }
.ph-tb .st { margin-left: auto; font-size: 11px; font-weight: 600; }
.st.ugly { color: var(--c-ugly); } .st.bad { color: var(--c-bad); } .st.good { color: var(--c-good); }
.hv { font-size: 21px; font-weight: 800; letter-spacing: -.02em; margin-top: 12px; }
.hc { color: var(--c-ink2); font-size: 12px; margin-top: 2px; }
.bar { height: 5px; border-radius: 3px; background: #EDEFF1; margin: 9px 0 12px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--c-good); border-radius: 3px; transition: width .5s ease; }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
.tile { border: 1px solid var(--c-line); border-radius: 11px; padding: 8px; display: grid; gap: 1px; }
.tile .l { font-size: 10.5px; font-weight: 700; }
.tile .v { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .w { font-size: 10px; color: var(--c-ink2); }
.tile.good .l { color: var(--c-good); } .tile.bad .l { color: var(--c-bad); } .tile.ugly .l { color: var(--c-ugly); }
.tile.on.good { border: 2px solid #A9D3B8; background: var(--c-good-t); } .tile.on.bad { border: 2px solid #E8C98C; background: var(--c-bad-t); } .tile.on.ugly { border: 2px solid #EBAAA4; background: var(--c-ugly-t); }
.tile.zero .v { color: var(--c-ink3); }
.lt { font-size: 13px; font-weight: 700; margin: 14px 0 4px; }
.row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--c-line); }
.row .av { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; }
.row .av svg { width: 15px; height: 15px; }
.row.ugly .av { background: var(--c-ugly-t); color: var(--c-ugly); } .row.bad .av { background: var(--c-bad-t); color: var(--c-bad); } .row.good .av { background: var(--c-good-t); color: var(--c-good); }
.row .t { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .s { font-size: 11px; color: var(--c-ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .tag { font-size: 10.5px; font-weight: 600; padding: 4px 8px; border-radius: 7px; white-space: nowrap; }
.row.ugly .tag { background: var(--c-ugly-t); color: var(--c-ugly); } .row.bad .tag { background: var(--c-bad-t); color: var(--c-bad); } .row.good .tag { background: var(--c-good-t); color: var(--c-good); }
.row.hot { background: linear-gradient(90deg, transparent, rgba(30,122,70,.06), transparent); animation: hot 1.6s ease 1; margin: 0 -14px; padding-inline: 14px; }
.row.root { border: 1.5px solid #EBAAA4; border-radius: 12px; padding: 10px; margin: 6px 0; background: #FFF8F7; }
.row.root.good { border-color: #A9D3B8; background: #F6FBF8; }
.row.root.bad { border-color: #E8C98C; background: #FFFBF3; }
.held { font-size: 11px; color: var(--c-ink2); padding: 4px 0 0 37px; }
@keyframes hot { 0% { background-color: rgba(30,122,70,.18); } 100% { background-color: transparent; } }
.ph-ft { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--c-line); padding: 7px 0 14px; font-size: 10px; color: var(--c-ink3); text-align: center; background: #fff; }
.ph-ft .on { color: var(--c-brand); font-weight: 700; }
.ph-ft svg { width: 17px; height: 17px; display: block; margin: 0 auto 2px; }
.trip { display: flex; gap: 12px; border-top: 1px solid var(--c-line); padding: 9px 14px 14px; font-size: 11px; color: var(--c-ink3); background: #fff; }
.trip .on { color: var(--c-brand); font-weight: 700; }
/* modal */
.dim { position: absolute; inset: 0; background: rgba(17,20,24,.45); z-index: 5; }
.md { position: absolute; left: 10px; right: 10px; top: 50%; transform: translateY(-50%); background: #fff; border-radius: 18px; padding: 16px; z-index: 6; box-shadow: 0 12px 40px rgba(0,0,0,.25); }
.md .x { position: absolute; right: 14px; top: 12px; color: var(--c-ink3); font-size: 16px; }
.md h5 { margin: 0; font-size: 17px; font-weight: 800; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding-right: 20px; }
.md h5 .tag { font-size: 10.5px; font-weight: 600; padding: 3px 8px; border-radius: 7px; }
.md h5 .tag.ugly { background: var(--c-ugly-t); color: var(--c-ugly); } .md h5 .tag.bad { background: var(--c-bad-t); color: var(--c-bad); } .md h5 .tag.good { background: var(--c-good-t); color: var(--c-good); }
.md .sub { font-size: 11.5px; color: var(--c-ink2); margin: 3px 0 10px; }
.md .ln { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 9px; padding: 7px 0; }
.md .ln .ci { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--c-fill); color: var(--c-ink2); }
.md .ln .ci svg { width: 14px; height: 14px; }
.md .ln b { display: block; font-size: 12px; }
.md .ln span { font-size: 11.5px; color: var(--c-ink2); line-height: 1.4; }
.btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.btn { border-radius: 11px; padding: 11px 6px; text-align: center; font-weight: 700; font-size: 12px; border: 1.5px solid var(--c-brand); color: var(--c-brand); background: #fff; }
.btn.p { background: var(--c-brand); color: #fff; }

<script id="data" type="application/json">{{DATA}}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  /* ── loop strip ─────────────────────────────────────── */
  var LOOP = [
    ["Incident", "Happens", "Van 2 finds Best Price Store shut, 11:20", "ugly"],
    ["Tag", "Tagged", "Kumar taps Shop Closed in the delivery app", "ugly"],
    ["Standing", "In the tower", "Missed · ₹4,820 not delivered", "ugly"],
    ["Lead action", "Fixed", "Call the shop, move it to Van 1, 4–8 pm", "bad"],
    ["Proof", "Recorded", "Ajay delivers at 5:10 pm", "good"],
    ["Resolved", "Back to green", "On track ✓ · Missed 0", "good"],
  ];
  var loopEl = $("#fig-loop");
  if (loopEl) {
    loopEl.innerHTML = '<ol class="loop">' + LOOP.map(function (s) {
      return '<li><span class="dot ' + s[3] + '"></span><span class="k">' + s[0] + '</span><span class="w">' + s[1] + '</span><span class="e">' + s[2] + "</span></li>";
    }).join("") + '</ol><div class="loop-back"><span aria-hidden="true">↺</span><span>If the clock runs out before the fix, the delivery <b>escalates to Missed</b> and comes back to the lead action.</span></div>';
  }

  /* ── catalogue ──────────────────────────────────────── */
  var CAT = DATA.catalog;
  var TODAY = ["Captured", "Partly", "Not captured"];
  var tone = function (s) { return /^Missed/.test(s) ? "ugly" : /^Pending/.test(s) ? "bad" : /^On track/.test(s) ? "good" : ""; };
  var splitLast = function (s) { var i = s.lastIndexOf(" · "); return i < 0 ? [s, ""] : [s.slice(0, i), s.slice(i + 3)]; };
  var catEl = $("#fig-catalog");
  if (catEl && CAT.length) {
    var families = []; CAT.forEach(function (r) { if (families.indexOf(r.family) < 0) families.push(r.family); });
    var state = { fam: "All", today: "All", q: "" };
    try { var saved = JSON.parse(store("fb.incidents.cat") || "null"); if (saved) state = Object.assign(state, saved); } catch (e) {}
    var count = function (rows, t) { return rows.filter(function (r) { return r.today === t; }).length; };
    var max = Math.max.apply(null, families.map(function (f) { return CAT.filter(function (r) { return r.family === f; }).length; }));
    catEl.innerHTML =
      '<div class="cov"><div class="cov-total"><div class="big">' + TODAY.map(function (t) { return "<div><b>" + count(CAT, t) + "</b><span>" + t.toLowerCase() + "</span></div>"; }).join("") + "</div>" +
      '<div class="cov-key"><span><i class="sw1"></i>captured today</span><span><i class="sw2"></i>partly</span><span><i class="sw3"></i>not captured</span></div>' +
      '<p class="note" style="margin:0">Of ' + CAT.length + ' incidents, the platform names ' + count(CAT, "Captured") + ' exactly today. Tap a family to filter.</p></div>' +
      '<div class="cov-rows">' + families.map(function (f) {
        var rows = CAT.filter(function (r) { return r.family === f; });
        var w = function (t) { return (count(rows, t) / max * 100) + "%"; };
        return '<button type="button" class="cov-row" data-fam="' + esc(f) + '"><span>' + esc(f) + '</span><span class="bars">' +
          (count(rows, "Captured") ? '<i class="sw1" style="width:' + w("Captured") + '"></i>' : "") +
          (count(rows, "Partly") ? '<i class="sw2" style="width:' + w("Partly") + '"></i>' : "") +
          (count(rows, "Not captured") ? '<i class="s3" style="width:' + w("Not captured") + '"></i>' : "") +
          '</span><span class="c">' + rows.length + "</span></button>";
      }).join("") + "</div></div>" +
      '<div class="cat-ctl"><input id="cat-q" type="search" placeholder="Search incidents, screens, actions" aria-label="Search the catalogue">' +
      '<div class="chips" id="cat-today">' + ["All"].concat(TODAY).map(function (t) { return '<button type="button" class="chip" data-today="' + t + '">' + (t === "All" ? "Any status" : t) + "</button>"; }).join("") + "</div></div>" +
      '<div class="chips" id="cat-fam">' + ["All"].concat(families).map(function (f) { return '<button type="button" class="chip" data-fam="' + esc(f) + '">' + (f === "All" ? "All families" : esc(f)) + "</button>"; }).join("") + "</div>" +
      '<div class="cat-count" id="cat-count"></div><div class="cat"><table><thead><tr><th>Incident</th><th>Owner attention</th><th>Today</th><th>Captured where</th><th>Starts as</th><th>Turns Missed when</th><th>Buttons in the tower</th><th>Closed when</th></tr></thead><tbody id="cat-body"></tbody></table></div>';
    var todayCls = { "Captured": "t1", "Partly": "t2", "Not captured": "t3" };
    var draw = function () {
      var q = state.q.trim().toLowerCase();
      var rows = CAT.filter(function (r) {
        return (state.fam === "All" || r.family === state.fam) && (state.today === "All" || r.today === state.today) &&
          (!q || Object.keys(r).some(function (k) { return r[k].toLowerCase().indexOf(q) >= 0; }));
      });
      $("#cat-body").innerHTML = rows.length ? rows.map(function (r) {
        var wh = splitLast(r.where), bs = r.buttons.split(" + ");
        return "<tr><td class=\"inc\"><small>" + esc(r.family) + "</small><b>" + esc(r.incident) + "</b></td>" +
          '<td class="att' + (r.attention === "Urgent" ? " urgent" : "") + '">' + esc(r.attention) + "</td>" +
          '<td><span class="today ' + todayCls[r.today] + '">' + esc(r.today) + "</span></td>" +
          "<td>" + esc(wh[0]) + (wh[1] ? '<span class="who">by ' + esc(wh[1]) + "</span>" : "") + "</td>" +
          "<td>" + (tone(r.starts) ? '<span class="pill ' + tone(r.starts) + '">' + esc(r.starts) + "</span>" : esc(r.starts)) + "</td>" +
          "<td>" + esc(r.red) + "</td>" +
          "<td>" + bs.map(function (b, k) { return '<span class="bt' + (k === bs.length - 1 ? " p" : "") + '">' + esc(b) + "</span>"; }).join("") + "</td>" +
          "<td>" + esc(r.closed) + "</td></tr>";
      }).join("") : '<tr><td colspan="8" class="cat-empty">No incident matches. Clear the search or pick another family.</td></tr>';

              '<div class="sugg"><b>Move to Van 1 · today 4–8 pm</b>Van 1 has room on its evening round and passes 600 m away.</div>',
            btns: [["Not now", ""], ["Confirm", "tower · you confirm", 1]] }); } },
      { st: [3], app: "Control Tower · Rakesh", time: "11:27", area: "bad", chase: ["1 being fixed", "4 fixed today"],

          rows: [{ k: "bad", t: BP.t, s: "Being fixed · Van 1, 4–8 pm", tag: "Shop closed", hot: 1 }].concat(others) }); } },
      { st: [4, 5], app: "Control Tower · Rakesh", time: "5:10 pm", area: "bad", chase: ["0 open", "5 fixed today"],

          rows: [{ k: "good", t: BP.t, s: "Delivered 5:10 pm by Ajay · fixed", tag: "✓ Fixed", hot: 1 }, { k: "good", t: "SSK MART JAYANAGAR", s: "Paid ₹2,140 at the door", tag: "Delivered" }, { k: "good", t: "Cake.in", s: "On credit", tag: "Delivered" }] }); } },
    ],
    [ // B · Van 2 stops
      { st: [0, 1], app: "Live Tracking · office", time: "12:25", area: "good", chase: ["0 open", "4 fixed today"],
        html: function () { return tracking(map() + '<div class="exc"><div class="h"><em>high</em>Kumar — van idle at stop · 20 min</div><div class="h"><em>new</em>Kumar reported: Breakdown <span style="color:#8A9099">· Report a problem</span></div><div><em style="background:#FBF1E0;color:#B7791F">med</em>Van 2 — 18 min behind</div></div>'); } },
      { st: [2], app: "Control Tower · Rakesh", time: "12:26", area: "ugly", chase: ["1 open · ₹38,600 at risk", "4 fixed today"],
        html: function () { return list({ del: 15, good: 15, bad: 8, ugly: 9, status: "ugly", sel: "ugly", ctx: "8 to deliver · ₹38,600 at risk",
          rows: [{ k: "ugly", t: "Van 2 broke down", s: "Since 12:05 · Jayanagar 4th Block", tag: "Breakdown", root: 1, hot: 1, icon: "truck", held: "Holding 9 stops · ₹38,600 · 3 due before 2 pm" }] }); } },
      { st: [2, 3], app: "Control Tower · Rakesh", time: "12:27", area: "ugly", chase: ["1 open · ₹38,600 at risk", "4 fixed today"],
        html: function () { return list({ del: 15, good: 15, bad: 8, ugly: 9, status: "ugly", sel: "ugly", ctx: "8 to deliver · ₹38,600 at risk", rows: [{ k: "ugly", t: "Van 2 broke down", s: "Since 12:05", tag: "Breakdown", root: 1, icon: "truck" }] }) +
          modal({ t: "Van 2 broke down", tag: "Breakdown", k: "ugly", sub: "Since 12:05 · Kumar · Jayanagar 4th Block", what: "Van 2 has not moved for 20 minutes. Kumar reported a breakdown.",
            impact: "9 stops held, ₹38,600. ODC, Cake Corner and ASSAM GOVT. are due before 2 pm.", rec: "Move the 3 due before 2 pm to Van 1 now. The other 6 can wait for the mechanic.",
            btns: [["Call Kumar", "outside"], ["Open Live Tracking", "platform ↗", 1]],
            trail: [["12:05", "Van 2 stopped moving"], ["12:25", "Kumar reported Breakdown"], ["now", "Needs you · 9 stops held", 1]] }); } },
      { st: [3], app: "Control Tower · Move to another van", time: "12:31", area: "ugly", chase: ["1 open · ₹38,600 at risk", "4 fixed today"],
        html: function () { return actionScreen("Move to another van", 2); } },
      { st: [4, 5], app: "Control Tower · Rakesh", time: "1:30 pm", area: "bad", chase: ["0 open", "5 fixed today"],
        html: function () { return list({ del: 19, good: 19, bad: 13, ugly: 0, status: "bad", sel: "good", ctx: "13 to deliver · nothing at risk",
          rows: [{ k: "good", t: "Van 2 moving again", s: "1:30 pm · 3 stops moved to Van 1, 6 back on route", tag: "✓ Fixed", root: 1, hot: 1 }, { k: "good", t: "ODC-OVER D COUNTER", s: "Delivered 1:05 pm by Ajay", tag: "Delivered" }] }); } },
    ],
    [ // C · Damaged goods
      { st: [0, 1], app: "Delivery app · Ajay, Van 1", time: "2:40 pm", area: "bad", chase: ["0 open", "5 fixed today"],
        html: function () { return driver("Product Return", "Cake Corner", '<div class="card"><div class="r"><b>Britannia Cake 60g</b><span>× 6</span></div><div class="r" style="color:#6b7280;margin-top:3px"><span>Returned to van stock</span><span>₹540</span></div></div>' +
          '<div class="sec">Return reason</div>' + chips([["Damaged", 1], ["Expired"], ["Unsold"], ["Wrong Product"]]) + '<div class="sec">What kind of damage?</div>' + chips([["Leaking", 1, 1], ["Wet carton", 0, 1], ["Broken pack", 0, 1]]), "↩ Record Return", " o"); } },
      { st: [2], app: "Control Tower · Rakesh", time: "2:41 pm", area: "bad", chase: ["1 open · ₹540", "5 fixed today"],
        html: function () { return list({ del: 22, good: 21, bad: 11, ugly: 0, status: "bad", sel: "bad", ctx: "10 to deliver · ₹540 to replace",
          rows: [{ k: "bad", t: "Cake Corner", s: "Delivered · 6 packs back · replace next trip", tag: "Damaged", hot: 1, icon: "box" }].concat(others) }); } },
      { st: [3], app: "Control Tower · Send on next trip", time: "2:43 pm", area: "bad", chase: ["1 being fixed", "5 fixed today"],
        html: function () { return actionScreen("Send on next trip", 2); } },
      { st: [4, 5], app: "Control Tower · next day", time: "Fri 10:15", area: "good", chase: ["0 open", "1 fixed today"],
        html: function () { return list({ del: 9, good: 9, bad: 21, ugly: 0, status: "bad", sel: "good", ctx: "21 to deliver · nothing at risk",
          rows: [{ k: "good", t: "Cake Corner", s: "Replacement delivered 10:15 · 6 packs", tag: "✓ Fixed", hot: 1 }, { k: "good", t: "Sai Bakers", s: "Paid ₹1,260 at the door", tag: "Delivered" }] }); } },
    ],
  ];
  var STAGES = ["Incident", "Tag", "In the tower", "Lead action", "Proof", "Resolved"];

  var skEl = $("#fig-sketches");
  if (skEl && DATA.scenarios.length) {
    var P = { sc: 0, st: 0, timer: null };
    try { var sv = JSON.parse(store("fb.incidents.player") || "null"); if (sv && SCREENS[sv.sc]) P.sc = sv.sc; } catch (e) {}
    var render = function () {
      var sc = DATA.scenarios[P.sc], scr = SCREENS[P.sc][P.st];
      skEl.innerHTML = '<div class="player"><div>' +
        '<div class="sc-tabs chips" role="tablist">' + DATA.scenarios.map(function (s, i) { return '<button type="button" role="tab" aria-selected="' + (i === P.sc) + '" class="chip' + (i === P.sc ? " on" : "") + '" data-sc="' + i + '">' + s.title + "</button>"; }).join("") + "</div>" +
        '<p class="sc-arc">' + sc.arc + "</p>" +
        '<div class="stages" aria-label="Where this step is in the loop">' + STAGES.map(function (s, i) { return '<span class="' + (scr.st.indexOf(i) >= 0 ? "on" : "") + '">' + s + "</span>"; }).join("") + "</div>" +
        '<ol class="steps">' + sc.steps.map(function (s, i) { return '<li><button type="button" class="' + (i === P.st ? "on" : "") + '" data-st="' + i + '"><span class="sn">' + (i + 1) + "</span><span>" + s + "</span></button></li>"; }).join("") + "</ol></div>" +
        '<div class="stage-col"><div class="area"><span class="nm">Deliveries</span><span class="pill ' + scr.area + '">' + ST[scr.area] + '</span></div>' +
        '<div class="chase"><span>' + scr.chase[0] + "</span><span>" + scr.chase[1] + "</span></div>" +
        shell(scr.app, scr.time, scr.html()) +
        '<div class="nav"><button type="button" data-go="-1"' + (P.st ? "" : " disabled") + '>‹ Back</button><button type="button" class="pri" data-play>' + (P.timer ? "Pause" : "Play the loop") + '</button><button type="button" data-go="1"' + (P.st < SCREENS[P.sc].length - 1 ? "" : " disabled") + ">Next ›</button></div></div></div>";
      store("fb.incidents.player", JSON.stringify({ sc: P.sc }));
    };
    var stop = function () { if (P.timer) { clearInterval(P.timer); P.timer = null; } };
    var go = function (d) { var n = P.st + d; if (n >= 0 && n < SCREENS[P.sc].length) { P.st = n; render(); return true; } return false; };
    skEl.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (b.hasAttribute("data-sc")) { stop(); P.sc = +b.getAttribute("data-sc"); P.st = 0; render(); }
      else if (b.hasAttribute("data-st")) { stop(); P.st = +b.getAttribute("data-st"); render(); }
      else if (b.hasAttribute("data-go")) { stop(); go(+b.getAttribute("data-go")); }
      else if (b.hasAttribute("data-play")) {
        if (P.timer) { stop(); render(); return; }
        if (P.st === SCREENS[P.sc].length - 1) P.st = 0;
        P.timer = setInterval(function () { if (!go(1)) { stop(); render(); } }, 3200);
        render();
      }
    });
    skEl.addEventListener("keydown", function (e) { if (e.key === "ArrowRight") { stop(); go(1); } if (e.key === "ArrowLeft") { stop(); go(-1); } });
    render();
  }


  /* ── action player: one action at a time, six steps ─── */
  var acEl = $("#fig-actions");
  if (acEl && DATA.actions.length) {
    var ASTEPS = ["Sheet", "Pick", "Confirm", "Done", "On the ground", "After"];
    var groups = []; DATA.actions.forEach(function (a) { if (groups.indexOf(a.group) < 0) groups.push(a.group); });
    var A = { i: 0, st: 0 };
    try { var sa = JSON.parse(store("fb.incidents.actions") || "null"); if (sa && DATA.actions[sa.i]) A.i = sa.i; } catch (e) {}
    var drawA = function () {
      var a = DATA.actions[A.i], n = a.steps.length;
      if (!ACT[a.title]) { acEl.textContent = "No sketch for " + a.title; return; }
      var tile = ACT[a.title].row.k === "ugly" && A.st < 5 ? "ugly" : ACT[a.title].after.st;
      acEl.innerHTML = '<div class="player"><div>' +
        '<div class="act-pick">' + groups.map(function (g) {
          return '<div class="act-grp"><span>' + esc(g) + '</span><div class="chips">' + DATA.actions.map(function (x, i) {
            return x.group === g ? '<button type="button" class="chip' + (i === A.i ? " on" : "") + '" data-ai="' + i + '">' + esc(x.title) + "</button>" : "";
          }).join("") + "</div></div>";
        }).join("") + "</div>" +
        '<h4 class="act-head">' + esc(a.title) + '</h4><p class="act-meta">' + a.meta + "</p>" +
        '<div class="stages">' + ASTEPS.map(function (s, i) { return '<span class="' + (i === A.st ? "on" : "") + '">' + s + "</span>"; }).join("") + "</div>" +
        '<ol class="steps">' + a.steps.map(function (s, i) { return '<li><button type="button" class="' + (i === A.st ? "on" : "") + '" data-as="' + i + '"><span class="sn">' + (i + 1) + "</span><span>" + s + "</span></button></li>"; }).join("") + "</ol></div>" +
        '<div class="stage-col"><div class="area"><span class="nm">Deliveries</span><span class="pill ' + tile + '">' + ST[tile] + "</span></div>" +
        shell(ACT_APP(a.title, A.st), A.st >= 5 ? "later" : "now", actionScreen(a.title, A.st)) +
        '<div class="nav"><button type="button" data-ago="-1"' + (A.st ? "" : " disabled") + '>‹ Back</button><button type="button" class="pri" data-ago="1"' + (A.st < n - 1 ? "" : " disabled") + ">Next ›</button></div></div></div>";
      store("fb.incidents.actions", JSON.stringify({ i: A.i }));
    };
    acEl.addEventListener("click", function (e) {
      var b = e.target.closest("button"); if (!b) return;
      if (b.hasAttribute("data-ai")) { A.i = +b.getAttribute("data-ai"); A.st = 0; }
      else if (b.hasAttribute("data-as")) A.st = +b.getAttribute("data-as");
      else if (b.hasAttribute("data-ago")) A.st = Math.max(0, Math.min(DATA.actions[A.i].steps.length - 1, A.st + +b.getAttribute("data-ago")));
      drawA();
    });
    drawA();
  }

  /* ── table of contents follows the reader ───────────── */
  var links = Array.prototype.slice.call(document.querySelectorAll(".toc a"));
  if ("IntersectionObserver" in window && links.length) {
    var io = new IntersectionObserver(function (es) {
      es.forEach(function (en) { if (en.isIntersecting) links.forEach(function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + en.target.id); }); });
    }, { rootMargin: "-20% 0px -70% 0px" });
    document.querySelectorAll("main section").forEach(function (s) { io.observe(s); });
  }
})();
</script>
