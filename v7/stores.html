<!doctype html>
<!--
  BUILT STORES — every store a distributor built in Store Builder, for
  FoodBridge's customer success team.

  The team's side of v7/store-builder (its last step, "Build my store").
  It reads GET /api/stores from the bridge with the TEAM key (FB_STORES_KEY
  on the bridge; typed here once and kept in this browser), and downloads
  each file through the bridge -- the files are private in the store, so
  there is no link to them that works without the key. Nothing is stored
  here but the key.

  Open it directly: /v7/stores.html -- not a platform destination, it is for
  the team. Point it at another bridge with ?fbapi=<base-url>.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Built stores — FoodBridge</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #f4f5f7; color: #0d0f12;
           font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { padding: 22px 20px 14px; background: #fff; border-bottom: 1px solid #e6e8eb; }
    h1 { margin: 0; font-size: 19px; }
    .sub { margin: 4px 0 0; font-size: 12.5px; color: #6b7079; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 16px 14px 60px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
    .pill { padding: 5px 11px; border-radius: 99px; background: #fff; border: 1px solid #e6e8eb; font-size: 12px; font-weight: 600; white-space: nowrap; }
    .pill.ok { color: #0e8a3c; border-color: #cfe8d8; background: #f3faf5; }
    .pill.no { color: #b23c3c; border-color: #f0d2d2; background: #fdf3f3; }
    input[type=search], input[type=password] { flex: 1 1 220px; min-width: 0; padding: 8px 12px; border: 1px solid #e6e8eb; border-radius: 9px; font: inherit; background: #fff; }
    button { padding: 7px 13px; border: 1px solid #e6e8eb; border-radius: 9px; background: #fff; font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer; }
    button.go { background: #0e8a3c; border-color: #0e8a3c; color: #fff; }
    button:disabled { opacity: .55; cursor: default; }
    .card { background: #fff; border: 1px solid #e6e8eb; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
    .top { display: flex; align-items: flex-start; gap: 12px; }
    .who { flex: 1; min-width: 0; }
    .who b { font-size: 15px; }
    .who small { display: block; color: #6b7079; font-size: 12.5px; }
    .when { flex: 0 0 auto; text-align: right; font-size: 11.5px; color: #6b7079; }
    .counts { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
    .counts span { padding: 2px 9px; border-radius: 99px; background: #f4f5f7; font-size: 12px; color: #2b2f35; }
    .counts span.warn { background: #fdf7ea; color: #a15c07; }
    .files { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .files details { font-size: 12.5px; }
    .files summary { cursor: pointer; padding: 7px 4px; font-weight: 600; color: #2b2f35; }
    .files details div { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 0; }
    .missing { margin: 10px 0 0; font-size: 12px; color: #a15c07; }
    .none { padding: 34px 16px; text-align: center; color: #6b7079; }
    .note { margin: 0 0 12px; padding: 10px 13px; border: 1px solid #f0e2c8; background: #fdf8ef;
            border-radius: 10px; font-size: 12.5px; color: #6b5c3f; line-height: 1.5; }
    .note[hidden], .key[hidden] { display: none; }
    .key { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    code { background: #eef0f3; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap" style="padding:0">
      <h1>Built stores</h1>
      <p class="sub">Every store a distributor built in Store Builder. Newest first. Open the Excel to set the store up.</p>
    </div>
  </header>
  <div class="wrap">
    <form class="key" id="keyForm" hidden>
      <input type="password" id="key" placeholder="Team key" autocomplete="current-password" aria-label="Team key" />
      <button class="go" type="submit">Open</button>
    </form>
    <div class="bar">
      <span class="pill" id="store">checking the bridge…</span>
      <span class="pill" id="count"></span>
      <input type="search" id="q" placeholder="Search shop, owner or mobile" aria-label="Search" />
      <button id="refresh">Refresh</button>
    </div>
    <p class="note" id="note" hidden></p>
    <div id="list"><p class="none">Loading…</p></div>
  </div>

  <script>
    var DEFAULT_BASE = "https://zoho-function-nu.vercel.app";
    var LOCAL_BASE = "http://localhost:8787";
    var KEY_STORE = "fb.stores.teamKey";
    var rows = [];

    function base() {
      var q = new URLSearchParams(location.search).get("fbapi");
      if (q) return q.replace(/\/+$/, "");
      return /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? LOCAL_BASE : DEFAULT_BASE;
    }
    function teamKey() { try { return localStorage.getItem(KEY_STORE) || ""; } catch (e) { return ""; } }
    function headers() { var k = teamKey(); return k ? { "X-FB-Team": k } : {}; }
    var esc = function (s) {
      return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    };
    function when(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return "";
      return d.getDate() + " " + ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][d.getMonth()] +
        " " + d.getFullYear() + ", " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
    }
    function size(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB"; }
    function note(html) { var n = document.getElementById("note"); n.hidden = !html; n.innerHTML = html || ""; }

    function fileBtn(s, f, label, cls) {
      return '<button class="' + (cls || "") + '" data-id="' + esc(s.id) + '" data-file="' + esc(f.name) + '">' + esc(label || f.name.split("/").pop()) + " · " + size(f.size) + "</button>";
    }

    function card(s) {
      var m = s.meta || {};
      var c = m.counts || {};
      var xl = s.files.filter(function (f) { return /\.xlsx$/.test(f.name); });
      var setup = s.files.filter(function (f) { return f.name === "setup.json"; });
      var photos = s.files.filter(function (f) { return /^photos\//.test(f.name); });
      var voice = s.files.filter(function (f) { return /^voice\//.test(f.name); });
      var bits = [m.owner, m.mobile, m.gst].filter(Boolean).map(esc).join(" · ");
      var chip = function (n, word, warn) { return '<span' + (warn ? ' class="warn"' : "") + ">" + n + " " + word + "</span>"; };
      return '<div class="card"><div class="top"><div class="who"><b>' + esc(m.shop || "No shop name yet") + "</b>" +
        (bits ? "<small>" + bits + "</small>" : "") + '</div><div class="when">' + esc(when(m.at)) + "<br>" + esc(s.id) + "</div></div>" +
        '<div class="counts">' + chip(c.products || 0, "products") + chip(c.customers || 0, "customers") + chip(c.suppliers || 0, "suppliers") +
          chip(c.staff || 0, "staff") + chip(c.counted || 0, "counted in stock") + chip((c.answered || 0) + "/7", "questions") +
          (c.gaps ? chip(c.gaps, "to follow up", true) : "") + "</div>" +
        '<div class="files">' + xl.map(function (f) { return fileBtn(s, f, "Excel", "go"); }).join("") +
          setup.map(function (f) { return fileBtn(s, f, "setup.json"); }).join("") +
          (photos.length ? "<details><summary>Photos · " + photos.length + "</summary><div>" + photos.map(function (f) { return fileBtn(s, f); }).join("") + "</div></details>" : "") +
          (voice.length ? "<details><summary>Voice notes · " + voice.length + "</summary><div>" + voice.map(function (f) { return fileBtn(s, f); }).join("") + "</div></details>" : "") +
        "</div>" +
        (s.missing && s.missing.length ? '<p class="missing">Still arriving from the phone: ' + s.missing.map(esc).join(", ") + "</p>" : "") + "</div>";
    }

    function draw() {
      var q = document.getElementById("q").value.trim().toLowerCase();
      var shown = rows.filter(function (s) {
        var m = s.meta || {};
        return !q || [m.shop, m.owner, m.mobile, m.gst, s.id].join(" ").toLowerCase().indexOf(q) >= 0;
      });
      document.getElementById("count").textContent = rows.length === 1 ? "1 store" : rows.length + " stores";
      document.getElementById("list").innerHTML = shown.length ? shown.map(card).join("")
        : '<p class="none">' + (rows.length ? "No store matches." : "No store built yet. They appear here when a distributor taps Build my store.") + "</p>";
    }

    function load() {
      note("");
      document.getElementById("keyForm").hidden = true;
      fetch(base() + "/api/stores", { headers: headers() }).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (b) { return { status: r.status, body: b }; });
      }).then(function (r) {
        var pill = document.getElementById("store");
        if (r.status === 401) {
          pill.className = "pill no"; pill.textContent = "team key needed";
          document.getElementById("keyForm").hidden = false;
          document.getElementById("list").innerHTML = '<p class="none">Type the team key to see the stores.</p>';
          if (teamKey()) note("That key was not accepted.");
          return;
        }
        if (r.status !== 200) {
          pill.className = "pill no"; pill.textContent = "no store on the bridge";
          document.getElementById("list").innerHTML = "";
          note("The bridge at <code>" + esc(base()) + "</code> answered <b>" + r.status + "</b>" +
            (r.body.error === "not_configured" ? ": no file store is set up. Set <code>BLOB_READ_WRITE_TOKEN</code> and <code>FB_STORES_KEY</code> and deploy." : ".") +
            " Builds wait on the phones and arrive once it is.");
          return;
        }
        pill.className = "pill ok"; pill.textContent = r.body.store === "blob" ? "private file store" : "local folder (dev)";
        rows = r.body.stores || [];
        draw();
      }).catch(function () {
        var pill = document.getElementById("store");
        pill.className = "pill no"; pill.textContent = "bridge not reachable";
        document.getElementById("list").innerHTML = "";
        note("Could not reach <code>" + esc(base()) + "</code>. Locally, run <code>npm run dev</code> in <code>zoho-function/</code>.");
      });
    }

    /* Private files: fetched with the key, then handed to the browser to save. */
    document.getElementById("list").addEventListener("click", function (e) {
      var b = e.target.closest("button[data-file]");
      if (!b) return;
      b.disabled = true;
      var name = b.dataset.file;
      fetch(base() + "/api/stores?id=" + encodeURIComponent(b.dataset.id) + "&file=" + encodeURIComponent(name), { headers: headers() })
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
        .then(function (blob) {
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = name === "setup.json" ? b.dataset.id + "-setup.json" : name.split("/").pop();
          document.body.appendChild(a); a.click();
          setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
        })
        .catch(function (err) { note("Could not download " + esc(name) + " (" + esc(err.message) + ")."); })
        .then(function () { b.disabled = false; });
    });
    document.getElementById("keyForm").addEventListener("submit", function (e) {
      e.preventDefault();
      try { localStorage.setItem(KEY_STORE, document.getElementById("key").value.trim()); } catch (err) { /* private window */ }
      load();
    });
    document.getElementById("q").addEventListener("input", draw);
    document.getElementById("refresh").addEventListener("click", load);
    load();
  </script>
</body>
</html>
