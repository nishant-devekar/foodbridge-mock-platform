<!doctype html>
<!--
  Sales Orders — the product-owner prototype of the production /orders screen.

  Vanilla HTML/CSS/JS, no build step, no framework. Runs entirely from js/data/*.json.
  Serve over HTTP (the data is fetched): python3 -m http.server, then open this file.

  URL options (all optional):
    ?chrome=full     the QA store's sidebar + header around the screen (default)
    ?chrome=none     the screen alone, exactly as the production module renders standalone
    ?scenario=empty | error | loading     how the list's server "answers"
    #/orders?search=…&status=…&page=…     deep-link a list state

  How it is built, and how to change it: README.md.
-->
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="js/tailwind.config.js"></script>
  <link rel="stylesheet" href="assets/mock-shell.css" />

</head>

  <script type="module" src="js/app.js?v=20260929VF1"></script>
</body>
</html>
