<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 360" width="400" height="360" fill="none">
  <!-- soft backdrop blobs -->
  <circle cx="320" cy="70" r="60" fill="#ffffff" opacity="0.06" />
  <circle cx="70" cy="300" r="80" fill="#ffffff" opacity="0.05" />

  <!-- clipboard -->
  <rect x="96" y="54" width="208" height="252" rx="22" fill="#ffffff" opacity="0.97" />
  <rect x="96" y="54" width="208" height="252" rx="22" stroke="#ccfbf1" stroke-width="2" opacity="0.4" />

  <!-- clip -->
  <rect x="168" y="40" width="64" height="30" rx="12" fill="#0f766e" />
  <rect x="180" y="34" width="40" height="18" rx="9" fill="#14b8a6" />

  <!-- header line -->
  <rect x="124" y="96" width="120" height="14" rx="7" fill="#0d9488" />
  <rect x="124" y="120" width="80" height="10" rx="5" fill="#99f6e4" />

  <!-- checklist rows -->
  <g>
    <circle cx="138" cy="168" r="13" fill="#22c55e" />
    <path d="M132 168l4 4 8-9" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="160" y="161" width="118" height="13" rx="6.5" fill="#e2e8f0" />
  </g>
  <g>
    <circle cx="138" cy="210" r="13" fill="#22c55e" />
    <path d="M132 210l4 4 8-9" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="160" y="203" width="100" height="13" rx="6.5" fill="#e2e8f0" />
  </g>
  <g>
    <circle cx="138" cy="252" r="13" fill="#f1f5f9" stroke="#5eead4" stroke-width="2.5" />
    <rect x="160" y="245" width="110" height="13" rx="6.5" fill="#f1f5f9" />
  </g>

  <!-- floating check badge -->
  <circle cx="300" cy="250" r="34" fill="#14b8a6" />
  <circle cx="300" cy="250" r="34" stroke="#ffffff" stroke-width="3" opacity="0.5" />
  <path d="M286 250l9 9 18-20" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
