<!doctype html>
<!--
  DISCOVERY SCREEN — Foodbridge Module Inventory Management — "Semi-Finished Inventory"
  (FoodBridge v7, 28 Sep 2026)

  The third stock, between Raw Material and Finished Goods: made, not packed
  yet. It was Production › Freezer Stock (Batch Management's port of the
  product's Semi-Finished Products screen, relabelled for one frozen-food
  business). Here it is stock like the other two, on the same engine:

    Current Stock          per product: Total · Reserved (held for packing
                           orders not packed yet) · Available · Shortfall
                           (what the short packets need, less what's available)
    Expiry report          the containers' use-by, as for finished goods
    Batch History Report   a lot per container: the batch that filled it and
                           the packing orders that took from it

  What the containers are and where they're kept comes from each recipe's
  fill step (Recipes › Process): big bags in a freezer for frozen food, drums
  in a dry store or tanks in a chiller for others. A recipe packed in the
  same run holds nothing here. No Receive Stock and no upload: the floor
  makes this stock and packing takes it.

  Data: the production store, merged in by ../../assets/mock-shell.js.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Semi-Finished Inventory</title>

  <!-- Tailwind, vendored (no build step, no network dependency at view time).
       Downloaded once from https://cdn.tailwindcss.com/3.4.16 -->
  <script src="../../assets/tailwind-play-3.4.16.js"></script>
  <script>
    // Mirrors storefront-frontend/tailwind.config.js — the custom `screens`
    // scale REPLACES Tailwind's defaults there, so it must here too or the
    // responsive breakpoints diverge.
    tailwind.config = {
      darkMode: "class",
      theme: {
        screens: {
          xss: "320px", xs: "420px", sm: "640px", md: "768px",
          ipad: { min: "960px", max: "1023px" },
          lg: "1024px", xl: "1280px", "2xl": "1440px",
        },
        extend: {
          fontFamily: {
            sans: ["system-ui", "sans-serif", "Arial", "Helvetica"],
            serif: ["system-ui", "sans-serif", "Arial", "Helvetica"],
          },
          boxShadow: {
            bottom: "0 5px 6px -7px rgba(0, 0, 0, 0.6), 0 2px 4px -5px rgba(0, 0, 0, 0.06)",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="../../assets/mock-shell.css" />
</head>
<body>
  <div id="root"></div>

  <!-- The end-of-demo footer and the three ways out behind it. One shared
       asset for every screen that carries it: v7/assets/exit-demo.js. -->
  <script src="../../../../assets/exit-demo.js?v=20260923DX2"></script>
  <script>
    /* The platform shell mounts the exit bar for every destination now.
       Mount our own only when this screen is opened on its own, or two
       bars stack at the foot of the page. */
    if (window.top === window.self) window.FB_EXIT.mount({
      /* Above the page, below this module's own overlays. */
      z: 39,
    });
  </script>
  <script src="../../assets/icons.js"></script>
  <script src="../../assets/mock-shell.js?v=20260929SL2"></script>
  <script src="../../assets/mock-inventory.js?v=20260929SL3"></script>
  <script>
    window.MockInventory.mount({ tab: "live", route: "/semi-finished-inventory", catalogueType: "SEMI-FINISHED", tabs: window.MockInventory.TABS_SF, title: "Semi-Finished Inventory" });
  </script>
</body>
</html>
