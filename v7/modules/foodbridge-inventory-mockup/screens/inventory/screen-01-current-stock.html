<!doctype html>
<!--
  DISCOVERY SCREEN — Foodbridge Module Inventory Management — "Current Stock"

  Standalone-openable: serve discovery/ over HTTP and open this file directly.
  Also reachable from the wiring hub (../../index.html).

  Tab 1 of 4 — the landing tab. Per-product stock with Total / Reserved /
  Available / Shortfall columns, searchable and sortable eight ways.

  Outgoing transitions (proto-FSM feeding SSOT-1 / SSOT-5):
    - Quick Stock Upload tab  -> screen-02-quick-stock-upload.html
    - Expiry report tab       -> screen-03-expiry-report.html
    - Batch History tab       -> screen-04-batch-history.html
    - Search matches nothing  -> screen-07-no-results.html

  Rules: HTML/CSS/vanilla JS only. No frameworks, no build step, no real API calls.
  Data comes from ../../seed-data/seed.json. Disposable — informs the SSOTs, not
  imported by development/.

  Ported from storefront-frontend@develop, route /inventory (src/pages/Inventory.jsx).
  See ../../instructions/addendum-002-live-inventory-port.md.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory — Current Stock</title>

  <!-- Tailwind, vendored (no build step, no network dependency at view time).
       Downloaded once from https://cdn.tailwindcss.com/3.4.16 -->
  <script src="../../assets/tailwind-play-3.4.16.js"></script>
  <script>
    // Mirrors storefront-frontend/tailwind.config.js — the custom `screens`
    // scale REPLACES Tailwind's defaults there, so it must here too or the
    // responsive breakpoints diverge.
    tailwind.config = {
      darkMode: "class",
      theme: {
        screens: {
          xss: "320px", xs: "420px", sm: "640px", md: "768px",
          ipad: { min: "960px", max: "1023px" },
          lg: "1024px", xl: "1280px", "2xl": "1440px",
        },
        extend: {
          fontFamily: {
            sans: ["system-ui", "sans-serif", "Arial", "Helvetica"],
            serif: ["system-ui", "sans-serif", "Arial", "Helvetica"],
          },
          boxShadow: {
            bottom: "0 5px 6px -7px rgba(0, 0, 0, 0.6), 0 2px 4px -5px rgba(0, 0, 0, 0.06)",
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="../../assets/mock-shell.css" />
</head>
<body>
  <div id="root"></div>

  <!-- The end-of-demo footer and the three ways out behind it. One shared
       asset for every screen that carries it: v7/assets/exit-demo.js. -->
  <script src="../../../../assets/exit-demo.js?v=20260918E3"></script>
  <script>
    /* The platform shell mounts the exit bar for every destination now.
       Mount our own only when this screen is opened on its own, or two
       bars stack at the foot of the page. */
    if (window.top === window.self) window.FB_EXIT.mount({
      /* Above the page, below this module's own overlays. */
      z: 39,
    });
  </script>
  <script src="../../assets/icons.js"></script>
  <script src="../../assets/mock-shell.js"></script>
  <script src="../../assets/mock-inventory.js"></script>
  <script>
    window.MockInventory.mount({ tab: "live" });
  </script>
</body>
</html>
