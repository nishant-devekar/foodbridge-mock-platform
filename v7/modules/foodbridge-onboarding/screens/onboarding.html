<!doctype html>
<!--
  FOODBRIDGE v7 — NEW USER ONBOARDING

  Five primary screens and nine contextual sheets, plus ONE destination: the
  drafts the flow prepares are held at #/sales-orders/order-drafts, which is
  this same page under ?view=drafts. The canonical UX is ux/FLOW-MAP.md; the
  four rules it was built under are in VERSION.md and argued in context/.

  Reached at #/onboarding — STANDALONE and FULL-BLEED. The user is ALREADY
  AUTHENTICATED when they arrive: no signup, no password, no terms.

  S02 BRINGS IN THE USER'S OWN DATA, and nothing else.
  Two real paths end in one hand-off (DataReady, see dataset.js):
    Connect an app   Zoho Books: a real sign-in and a read-only read, through
                     the bridge. "Connected" only after a genuine return.
    Upload files     Excel and CSV, read in this browser. Each file says what
                     it holds from its own columns (a workbook can hold several
                     kinds); FoodBridge asks only when a file cannot. A result
                     per file, in business words.
  S03 onward sees only that hand-off. There is no demonstration business in
  the flow, and no global data for it to fall back to.

  LOAD ORDER MATTERS and is not incidental:
    icons.js            window.FB_ICONS
    integration-config.js window.FB_INTEGRATION — which bridge to call. Same
                        resolver the Stock Audit screen uses, so ?fbapi= points
                        both at one place.
    predictive-order.js window.FB_PREDICT — the back-tested reorder engine
    dataset.js          window.FB_DATASET — files and Zoho records → Dataset
    evidence.js         window.FB_EVIDENCE — what the Dataset can support
    readers.js          window.FB_READERS — the real Zoho and file readers,
                        and the guard that decides whether dev stand-ins may
                        load at all
    [dev only]          order-history.js + seed.inline.js + readers-mock.js,
                        written in ONLY when readers.js allows it: localhost
                        and ?fbmock=… . Never on a published host.
    onboarding.js       the screens, the sheets, the drafts destination
  See ../../../VERSION.md.
-->
