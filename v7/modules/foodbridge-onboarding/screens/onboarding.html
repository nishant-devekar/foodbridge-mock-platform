<!--
  FOODBRIDGE v7 — NEW USER ONBOARDING

  Five primary screens and nine contextual sheets, plus ONE destination: the
  drafts the flow prepares are held at #/sales-orders/order-drafts, which is
  this same page under ?view=drafts. The canonical UX is ux/FLOW-MAP.md; the
  four rules it was built under are in VERSION.md and argued in context/.

  Reached at #/onboarding — STANDALONE and FULL-BLEED. The user is ALREADY
  AUTHENTICATED when they arrive: no signup, no password, no terms.

  THIS BUILD IS A PREVIEW, AND SAYS SO WHERE IT MATTERS.
  There is no connector. Tally, Zoho and Vyapar cannot be read, so choosing
  one loads a DEMONSTRATION BUSINESS and the consent sheet says that before
  the user commits. An amber provenance chip naming the demonstration sits on
  every screen from S03 onward and opens a sheet explaining it. Nothing in the
  customer-facing UI claims a connection, an export, a lookup or a send that
  did not happen.

  LOAD ORDER MATTERS and is not incidental:
    order-history.js    window.FB_ORDER_HISTORY — the tenant's real Zoho
                        export, used here as the demonstration business. Must
                        precede the seed, which adopts it as
                        SEED.orderingSignals.
    seed.inline.js      window.SEED — 86 products, 40 B2B shops
    predictive-order.js window.FB_PREDICT — the back-tested reorder engine
    integration-config.js window.FB_INTEGRATION — which bridge to call and
                        with what key. Same resolver the Stock Audit screen
                        uses, so ?fbapi= points both at one place.
    evidence.js         window.FB_EVIDENCE — what we have, what is
                        computable, what is blocked, what would unlock
    onboarding.js       the five screens, the sheets, the drafts destination

  The first three are REUSED by reference from the Stock Audit module rather
  than copied: they are this version's data and engines, and a second copy is
  how two views of one business start disagreeing. The stylesheet is NOT
  shared, deliberately — see onboarding.css.

  Real vs simulated, at a glance:
    The order history, and the
      cadence/stock/reorder maths   REAL      — computed, not invented
    Whose records they are          DEMO      — a demonstration business, in
                                                every mode, always labelled
    Tally / Zoho / Vyapar           NOT BUILT — never contacted; the sheet
                                                says so before you commit
    Document upload, extraction     NOT BUILT — reports that it read nothing
    GSTIN check                     FORMAT ONLY — no lookup, and it claims
                                                none: it says "Format checked"
    Draft preparation               REAL in the browser — held, never sent,
                                                never written. Reviewable and
                                                editable at Order Drafts.
    Receivables, collections,
      capital tied, margin          ABSENT    — no evidence exists for this
                                                tenant, so nothing is drawn
  See context/STATUS.md.
-->
