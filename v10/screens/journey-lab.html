<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey Lab — FoodBridge</title>
<link rel="icon" href="../favicon.ico">
<!-- Journey Lab (15 Oct 2026): inject a journey graph (fb.journey/1) and a store's facts, and watch the
     engine walk it: states, the focus, where the user stands, what is next and what holds it back.
     Engine: ../assets/journey/engine.js (zero context). Facts names: ../assets/ct/journey-facts.js. -->
<style>
:root {
  --canvas: #FFFFFF; --fill: #F6F7F8; --ink: #111418; --ink-2: #5B616B; --ink-3: #8A9099; --line: #E5E7E9;
  --brand: #1E7A46; --brand-t: #E8F3EC; --bad: #B7791F; --bad-t: #FBF1E0; --ugly: #C0362C; --ugly-t: #FBEAE8;
  --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--fill); color: var(--ink); font: 400 14px/1.45 var(--font); }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px; background: var(--canvas); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 17px; letter-spacing: -.01em; }
header p { margin: 0; color: var(--ink-2); font-size: 13px; flex: 1 1 320px; }
main { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(300px, 1.1fr) minmax(300px, 1.1fr); gap: 12px; padding: 12px 16px 24px; align-items: start; }
@media (max-width: 1100px) { main { grid-template-columns: 1fr 1fr; } .p-in { grid-column: 1 / -1; } }
@media (max-width: 720px) { main { grid-template-columns: 1fr; } }
.panel { background: var(--canvas); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { margin: 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
label { font-size: 12px; font-weight: 600; color: var(--ink-2); display: grid; gap: 4px; }
textarea { width: 100%; min-height: 200px; resize: vertical; font: 12px/1.45 var(--mono); border: 1px solid var(--line); border-radius: 10px; padding: 10px; color: var(--ink); background: var(--fill); }
#graph { min-height: 260px; }
select, input[type=text] { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 9px; background: var(--canvas); color: var(--ink); min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 600 13px/1 var(--font); border-radius: 10px; padding: 9px 12px; border: 1px solid var(--line); background: var(--canvas); color: var(--ink); cursor: pointer; }
button.go { background: var(--brand); border-color: var(--brand); color: #fff; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.errs { margin: 0; padding: 10px 12px 10px 28px; background: var(--ugly-t); color: var(--ugly); border-radius: 10px; font: 12px/1.5 var(--mono); }
.errs:empty { display: none; }
.ok { color: var(--brand); font-size: 12px; font-weight: 600; }
.tree { display: grid; gap: 2px; }
.node { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; cursor: pointer; border: 1px solid transparent; text-align: left; background: none; font-weight: 400; }
.node:hover { background: var(--fill); }
.node.cur { border-color: var(--ink); background: var(--fill); }
.node .t { display: flex; align-items: center; gap: 6px; min-width: 0; }
.node .t b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.node .ty { font: 11px/1 var(--mono); color: var(--ink-3); }
.node .star { color: var(--brand); font-weight: 800; }
.st { font: 600 11px/1 var(--font); padding: 4px 7px; border-radius: 99px; white-space: nowrap; }
.st[data-s=done] { background: var(--brand-t); color: var(--brand); }
.st[data-s=available] { background: var(--bad-t); color: var(--bad); }
.st[data-s=locked] { background: var(--fill); color: var(--ink-3); }
.st[data-s=skipped] { background: var(--fill); color: var(--ink-3); text-decoration: line-through; }
.opt { font-size: 10.5px; color: var(--ink-3); }
.where { display: grid; gap: 8px; }
.where .big { font-size: 20px; font-weight: 800; letter-spacing: -.01em; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.crumbs { color: var(--ink-2); font-size: 12.5px; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 10px; font-size: 13px; }
.kv dt { color: var(--ink-3); } .kv dd { margin: 0; min-width: 0; }
.list { display: grid; gap: 6px; }
.li { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; }
.li small { display: block; color: var(--ink-3); font-size: 11.5px; }
.li button { padding: 6px 9px; font-size: 12px; }
pre.payload { margin: 0; font: 11.5px/1.5 var(--mono); background: var(--fill); border-radius: 10px; padding: 10px; overflow-x: auto; max-height: 220px; }
.bar { height: 6px; border-radius: 4px; background: var(--fill); overflow: hidden; } .bar i { display: block; height: 100%; background: #22A45D; }
.log { display: grid; gap: 4px; max-height: 220px; overflow: auto; font: 12px/1.4 var(--mono); }
.log div { padding: 4px 6px; border-radius: 6px; background: var(--fill); }
.log:empty::before { content: "Change the facts and apply: what opens, closes or reopens shows here."; color: var(--ink-3); font-family: var(--font); }
.marks { display: flex; flex-wrap: wrap; gap: 6px; }
.mark { font: 600 12px/1 var(--mono); padding: 6px 8px; border-radius: 99px; background: var(--brand-t); color: var(--brand); border: 0; }
</style>
</head>
<body>
<header>
  <h1>Journey Lab</h1>
  <p>Inject a journey graph and a store's facts. The engine knows nothing of the business: it only walks the graph it is given and says where the user stands.</p>
  <button id="reset" type="button">Reset position</button>
</header>
<main>
  <section class="panel p-in" aria-labelledby="h-in">
    <h2 id="h-in">Inject</h2>
    <label for="graph">Graph · fb.journey/1</label>
    <textarea id="graph" spellcheck="false"></textarea>
    <div class="row">
      <label for="preset" style="display:flex;gap:6px;align-items:center">Facts preset
        <select id="preset">
          <option value="new">A store created a minute ago</option>
          <option value="products">42 products in, 3 broken</option>
          <option value="active">Products and customers fixed</option>
          <option value="first">First order in</option>
          <option value="day">First delivery and payment</option>
          <option value="maker">A manufacturer, day one</option>
          <option value="all">Everything proven</option>
        </select>
      </label>
    </div>
    <label for="facts">Facts</label>
    <textarea id="facts" spellcheck="false"></textarea>
    <div class="row"><button id="apply" class="go" type="button">Apply</button><span id="okmsg" class="ok" role="status"></span></div>
    <ul id="errs" class="errs" aria-live="polite"></ul>
  </section>

  <section class="panel" aria-labelledby="h-tree">
    <h2 id="h-tree">The graph, walked</h2>
    <div class="bar" aria-hidden="true"><i id="bar" style="width:0"></i></div>
    <div id="prog" class="crumbs"></div>
    <div id="tree" class="tree"></div>
  </section>

  <section class="panel" aria-labelledby="h-where">
    <h2 id="h-where">Where the user stands</h2>
    <div id="where" class="where"></div>
    <h2>Marks</h2>
    <div class="row"><input id="markKey" type="text" placeholder="e.g. skip:purchase" aria-label="Mark key"><button id="markBtn" type="button">Toggle mark</button></div>
    <div id="marks" class="marks"></div>
    <h2>Events</h2>
    <div id="log" class="log" aria-live="polite"></div>
  </section>
</main>

<script src="../assets/journey/engine.js?v=20261015JE1"></script>
<script src="../assets/ct/journey-facts.js?v=20261015JE1"></script>
<script src="journey-lab.js?v=20261015JE1"></script>
</body>
</html>
