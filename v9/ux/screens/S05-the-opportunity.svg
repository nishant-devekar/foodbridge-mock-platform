<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 844" width="1210" height="844" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- S05 — The opportunity · THREE STATES OF ONE SCREEN. LOW FIDELITY.
       Flow nodes: F15, F20. Redrawn against D-018.

       ENTERS ON A BRIEF, never on a selection task. The split is explained
       once, here, instead of as a caveat under a list.
       NOTHING IS PRE-SELECTED: a recommendation is marked, and selecting all
       sixteen is one deliberate tap. The previous design pre-ticked 23 shops
       and called the result the user's choice.
       MOVED into the shop sheet: "usually buys" — two lines on every row was a
       wall of text, not a decision aid.
       "PREPARED", never "started": nothing is sent and nothing is contacted. -->
  <rect x="0" y="0" width="1210" height="844" fill="#ffffff"/>

  <!-- ============================ brief ============================= -->
  <rect x="0" y="0" width="390" height="844" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="24" y="44" font-size="13" font-weight="600" fill="#111111">FoodBridge</text>
  <line x1="0" y1="66" x2="390" y2="66" stroke="#e5e7eb" stroke-width="1"/>
  <text x="24" y="100" font-size="16" fill="#999999">&#8249;</text>

  <text x="24" y="146" font-size="25" font-weight="700" fill="#111111">Shops that stopped</text>
  <text x="24" y="176" font-size="25" font-weight="700" fill="#111111">ordering</text>

  <text x="24" y="228" font-size="34" font-weight="700" fill="#111111">23</text>
  <text x="74" y="228" font-size="15" fill="#666666">shops, longest overdue first</text>

  <rect x="20" y="268" width="350" height="86" rx="12" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="38" y="302" font-size="20" font-weight="700" fill="#111111">16</text>
  <text x="76" y="302" font-size="15" fill="#111111">we can prepare a reorder for</text>
  <text x="38" y="330" font-size="12" fill="#666666">Their buying pattern is still current</text>

  <rect x="20" y="368" width="350" height="86" rx="12" fill="none" stroke="#999999" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="38" y="402" font-size="20" font-weight="700" fill="#666666">7</text>
  <text x="66" y="402" font-size="15" fill="#111111">need your eye</text>
  <text x="38" y="430" font-size="12" fill="#666666">Quiet too long for a pattern to count</text>

  <rect x="20" y="694" width="350" height="54" rx="10" fill="#111111"/>
  <text x="195" y="728" font-size="16" fill="#ffffff" text-anchor="middle">See the 16 recommended</text>
  <text x="195" y="778" font-size="14" fill="#666666" text-anchor="middle">See the 7 instead</text>

  <!-- ========================= recommended ========================== -->
  <rect x="410" y="0" width="390" height="844" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="434" y="44" font-size="13" font-weight="600" fill="#111111">FoodBridge</text>
  <line x1="410" y1="66" x2="800" y2="66" stroke="#e5e7eb" stroke-width="1"/>
  <text x="434" y="100" font-size="16" fill="#999999">&#8249;</text>

  <text x="434" y="140" font-size="22" font-weight="700" fill="#111111">16 recommended</text>

  <!-- selection is a deliberate act, not a default -->
  <rect x="430" y="164" width="164" height="38" rx="9" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="512" y="189" font-size="13" font-weight="600" fill="#111111" text-anchor="middle">Select all 16</text>
  <text x="776" y="189" font-size="13" fill="#666666" text-anchor="end">0 selected</text>

  <rect x="430" y="220" width="350" height="76" rx="12" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="446" y="240" width="20" height="20" rx="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="478" y="250" font-size="14" font-weight="600" fill="#111111">GIRIRAJ STORE</text>
  <text x="478" y="272" font-size="12" fill="#666666">117d cycle &#183; 24d overdue</text>
  <text x="764" y="250" font-size="13" fill="#cccccc" text-anchor="end">&#8250;</text>

  <rect x="430" y="308" width="350" height="76" rx="12" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="446" y="328" width="20" height="20" rx="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="478" y="338" font-size="14" font-weight="600" fill="#111111">A&amp;T BROTHERS</text>
  <text x="478" y="360" font-size="12" fill="#666666">20d cycle &#183; 100d overdue</text>
  <text x="764" y="338" font-size="13" fill="#cccccc" text-anchor="end">&#8250;</text>

  <rect x="430" y="396" width="350" height="76" rx="12" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <rect x="446" y="416" width="20" height="20" rx="5" fill="none" stroke="#999999" stroke-width="1.5"/>
  <text x="478" y="426" font-size="14" font-weight="600" fill="#111111">BHARATI STORE</text>
  <text x="478" y="448" font-size="12" fill="#666666">53d cycle &#183; 61d overdue</text>
  <text x="764" y="426" font-size="13" fill="#cccccc" text-anchor="end">&#8250;</text>

  <text x="434" y="512" font-size="13" fill="#666666">13 more</text>

  <!-- disabled until the user has actually chosen -->
  <rect x="430" y="700" width="350" height="54" rx="10" fill="none" stroke="#cccccc" stroke-width="1.5"/>
  <text x="605" y="734" font-size="16" fill="#cccccc" text-anchor="middle">Select shops to prepare drafts</text>

  <!-- ========================== prepared ============================ -->
  <rect x="820" y="0" width="390" height="844" fill="#ffffff" stroke="#111111" stroke-width="2"/>
  <text x="844" y="44" font-size="13" font-weight="600" fill="#111111">FoodBridge</text>
  <line x1="820" y1="66" x2="1210" y2="66" stroke="#e5e7eb" stroke-width="1"/>

  <circle cx="1015" cy="190" r="36" fill="none" stroke="#111111" stroke-width="2"/>
  <text x="1015" y="203" font-size="32" fill="#111111" text-anchor="middle">&#10003;</text>

  <text x="1015" y="272" font-size="24" font-weight="700" fill="#111111" text-anchor="middle">16 drafts prepared</text>

  <rect x="840" y="316" width="350" height="126" rx="12" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <text x="858" y="348" font-size="13" fill="#666666">Held for your review</text>
  <text x="1172" y="348" font-size="14" font-weight="700" fill="#111111" text-anchor="end">16</text>
  <line x1="858" y1="364" x2="1172" y2="364" stroke="#f1f5f9" stroke-width="1"/>
  <text x="858" y="392" font-size="13" fill="#666666">Sent to shops</text>
  <text x="1172" y="392" font-size="14" font-weight="700" fill="#111111" text-anchor="end">0</text>
  <line x1="858" y1="408" x2="1172" y2="408" stroke="#f1f5f9" stroke-width="1"/>
  <text x="858" y="436" font-size="13" fill="#666666">Written to Zoho</text>
  <text x="1172" y="436" font-size="14" font-weight="700" fill="#111111" text-anchor="end">0</text>

  <rect x="840" y="694" width="350" height="54" rx="10" fill="#111111"/>
  <text x="1015" y="728" font-size="16" fill="#ffffff" text-anchor="middle">Review 16 drafts</text>
  <text x="1015" y="778" font-size="14" fill="#666666" text-anchor="middle">Go to FoodBridge</text>
</svg>
